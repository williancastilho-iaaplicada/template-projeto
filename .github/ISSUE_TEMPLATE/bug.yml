name: "🐞 Bug"
description: "Algo que não funciona como deveria / Something is not working"
labels: ["tipo:bug"]
body:
  - type: textarea
    id: oque
    attributes:
      label: "🇧🇷 O que aconteceu / 🇺🇸 What happened"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "🇧🇷 O que era esperado / 🇺🇸 What was expected"
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: "🔁 Como reproduzir / How to reproduce"
